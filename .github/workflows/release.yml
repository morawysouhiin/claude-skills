# 各スキルのZIPを作ってGitHubリリースに添付する。
# 実行方法は2通り:
#   1. Actions タブ → Release → Run workflow で、バージョン（例: v1.0.0）を入力して実行
#   2. v から始まるタグをpushする
# リリースノートは .github/release-notes/<バージョン>.md があればそれを使い、なければ自動生成する。
# 同じバージョンのリリースが既にある場合は、ZIPだけを差し替える。
name: Release

on:
  workflow_dispatch:
    inputs:
      version:
        description: "リリースするバージョン（例: v1.0.0）"
        required: true
  push:
    tags:
      - "v*"

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest
    env:
      GH_TOKEN: ${{ github.token }}
      VERSION: ${{ inputs.version || github.ref_name }}
    steps:
      - uses: actions/checkout@v4

      - name: Build skill ZIPs
        run: bash scripts/package.sh

      - name: Create or update release
        run: |
          NOTES=".github/release-notes/${VERSION}.md"
          if gh release view "$VERSION" >/dev/null 2>&1; then
            gh release upload "$VERSION" dist/*.zip --clobber
          elif [ -f "$NOTES" ]; then
            gh release create "$VERSION" dist/*.zip --title "$VERSION" --target "$GITHUB_SHA" --notes-file "$NOTES"
          else
            gh release create "$VERSION" dist/*.zip --title "$VERSION" --target "$GITHUB_SHA" --generate-notes
          fi
